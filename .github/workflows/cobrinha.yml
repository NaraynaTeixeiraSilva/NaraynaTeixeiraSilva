name: Generate Datas

on:
  schedule: # execute every 12 hours
    - cron: "* */12 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    steps:
      # Garantir que o branch 'output' existe
      - name: Configurar branch de saída
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          if ! git ls-remote --exit-code --heads origin output; then
            git checkout --orphan output
            git rm -rf .
            echo "Branch de saída criado." > README.md
            git add README.md
            git commit -m "Criar branch de saída"
            git push origin output
          fi

      # Snake Animation
      - uses: Platane/snk@master
        id: snake-gif
        with:
          github_user_name: NaraynaTeixeiraSilva
          svg_out_path: dist/github-contribution-grid-snake.svg

      - uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
